name: Kezaihui
description: 'Kezaihui (再惠 / Zaihuihui (Shanghai) Network Technology Co., Ltd.) is a
  Shanghai-based Chinese SaaS platform for local-life-service commerce, providing offline
  merchants — primarily mid-tier restaurants plus entertainment, beauty, and hospitality
  businesses — with one-stop store-opening and digital-operations tooling. Founded around
  2012, the company offers private-domain member and community management, trading-platform
  shop diagnostics and automated strategy recommendations, content-creator (influencer)
  marketing, multi-channel precision ad delivery, and the Hui Shenghuo (惠生活) rights-aggregation
  platform, helping merchants operate across Meituan, Douyin, Xiaohongshu, and Taobao.
  It reports serving hundreds of thousands of merchants across dozens of Chinese cities
  with more than 1,000 employees. Surfaced as a portfolio company of DCM Ventures and
  added to the API Evangelist network; no public developer program or API surface was
  found during enrichment.'
